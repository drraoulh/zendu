# Construit l'AAB Android (fichier à envoyer sur Google Play) directement sur GitHub, sans EAS.
# Lancement manuel seulement : Actions → « AAB Android » → Run workflow, en indiquant le numéro de version
# (versionCode) : il doit être SUPÉRIEUR à celui du dernier AAB envoyé sur Google Play.
#
# Signature : la clé d'envoi (upload key) des AAB déjà publiés, récupérée depuis le compte Expo, à placer dans
# Settings → Secrets and variables → Actions → Secrets :
#   ANDROID_KEYSTORE_BASE64   le fichier .jks encodé en base64
#   ANDROID_KEYSTORE_PASSWORD mot de passe du fichier
#   ANDROID_KEY_ALIAS         alias de la clé
#   ANDROID_KEY_PASSWORD      mot de passe de la clé
# Sécurité : le build s'arrête si l'empreinte de la clé n'est pas celle des AAB déjà envoyés à Google Play,
# pour ne jamais produire un fichier que Google refuserait.
name: AAB Android

on:
  # Se lance aussi quand ce fichier est modifié sur la branche de travail (le numéro de version par défaut est
  # alors « 9 » (valeur après « inputs.version_code || », 5 endroits) : à augmenter à chaque nouvel envoi sur Google Play).
  push:
    branches: [claude/loving-meitner-akjeks]
    paths: [".github/workflows/android-aab.yml"]
  workflow_dispatch:
    inputs:
      version_code:
        description: "Numéro de version (versionCode), supérieur au dernier envoyé sur Google Play"
        required: false
        type: string

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Empreinte SHA-1 de la clé d'envoi des AAB déjà publiés (lue sur l'AAB de production précédent).
      EXPECTED_SHA1: "F0:90:D3:30:A3:BB:F9:C6:37:94:FB:8D:B6:21:E9:40:8F:47:ED:D8"
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://worldsofttransfer.com' }}
      EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL || 'https://worldsofttransfer.com' }}
      EXPO_PUBLIC_COMPANY_EMAIL: ${{ vars.EXPO_PUBLIC_COMPANY_EMAIL || 'support@worldsofttransfer.com' }}
      EXPO_PUBLIC_COMPANY_PHONE: ${{ vars.EXPO_PUBLIC_COMPANY_PHONE || '+1 416 830 3459' }}
      EXPO_PUBLIC_COMPANY_LEGAL_NAME: Paul World Finances and Technologies Ltd.
      EXPO_PUBLIC_COMPANY_WHATSAPP: ${{ vars.EXPO_PUBLIC_COMPANY_WHATSAPP }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Numéro de version valide
        working-directory: ${{ github.workspace }}
        env:
          VERSION_CODE: ${{ inputs.version_code || '9' }}
        run: |
          case "$VERSION_CODE" in ''|*[!0-9]*) echo "::error::Le numéro de version doit être un entier."; exit 1;; esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - run: npm ci

      - name: Clé de signature (vérification de l'empreinte)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Secrets de signature manquants (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          FOUND=$(keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -alias "$KS_ALIAS" 2>/dev/null | grep -m1 "SHA1:" | sed 's/.*SHA1: *//' | tr -d ' ')
          WANT=$(printf '%s' "$EXPECTED_SHA1" | tr -d ' ')
          if [ "$FOUND" != "$WANT" ]; then
            echo "::error::L'empreinte de la clé ne correspond pas à celle des AAB déjà publiés (trouvée : ${FOUND:-aucune}). Build arrêté."
            exit 1
          fi
          echo "Clé de signature conforme (SHA1 $FOUND)."

      - name: Projet natif Android
        run: npx expo prebuild --platform android --no-install

      - name: Numéro de version et mémoire
        working-directory: mobile/android
        env:
          VERSION_CODE: ${{ inputs.version_code || '9' }}
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" app/build.gradle
          grep -n "versionCode" app/build.gradle
          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          printf '\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n' >> gradle.properties

      - name: Compilation de l'AAB signé
        working-directory: mobile/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Vérification de la signature de l'AAB
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA1|SHA256|Valid"
          mv "$AAB" "WorldSoft-Transfer-v${{ inputs.version_code || '9' }}.aab"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: WorldSoft-Transfer-AAB-v${{ inputs.version_code || '9' }}
          path: mobile/WorldSoft-Transfer-v${{ inputs.version_code || '9' }}.aab
          retention-days: 30
