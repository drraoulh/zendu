# Construit l'appli Android sur les serveurs d'Expo (EAS). Au premier lancement, EAS crée et garde
# la clé de signature Android (keystore) : plus besoin de la fournir sur expo.dev.
# Prérequis : secret de dépôt EXPO_TOKEN (expo.dev → Account settings → Access tokens).
# Lancement : onglet Actions → « Build Android (EAS) » → Run workflow.
name: Build Android (EAS)

on:
  # Le bouton « Run workflow » n'apparaît que pour la branche par défaut : ce fichier sert aussi de
  # déclencheur (une modification poussée sur la branche lance une construction « preview »).
  push:
    branches: [claude/loving-meitner-akjeks]
    paths: [".github/workflows/eas-android.yml"]
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil EAS (preview = APK à installer, production = AAB pour le Play Store)"
        required: true
        default: preview
        type: choice
        options: [preview, production]

jobs:
  eas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://worldsofttransfer.com' }}
      EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL || 'https://worldsofttransfer.com' }}
      EXPO_PUBLIC_COMPANY_EMAIL: ${{ vars.EXPO_PUBLIC_COMPANY_EMAIL || 'support@worldsofttransfer.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le jeton Expo
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error::Ajoutez le secret EXPO_TOKEN (Settings → Secrets and variables → Actions)."; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Fichier Firebase (notifications Android)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json; fi

      - name: Construction sur EAS (la clé de signature est créée au premier lancement)
        run: npx --yes eas-cli@latest build --platform android --profile "${{ inputs.profile || 'preview' }}" --non-interactive --no-wait
