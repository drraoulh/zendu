# Construit l'APK Android de WorldSoft Transfer (installable directement sur un téléphone).
# Le fichier est à télécharger dans l'onglet Actions → ce workflow → « Artifacts ».
# L'URL de l'API est intégrée à la construction : variable de dépôt EXPO_PUBLIC_API_URL
# (Settings → Secrets and variables → Actions → Variables), sinon https://worldsofttransfer.com.
name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [claude/loving-meitner-akjeks]
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

# Droits minimaux du jeton GitHub : lecture du dépôt seulement.
permissions:
  contents: read

jobs:
  apk:
    # Un APK par type de processeur (plus léger qu'un APK universel) :
    # arm64 = la plupart des téléphones ; armv7 = anciens modèles et téléphones « Android Go » 32 bits.
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            label: arm64
          - abi: armeabi-v7a
            label: armv7
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://worldsofttransfer.com' }}
      EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL || 'https://worldsofttransfer.com' }}
      EXPO_PUBLIC_COMPANY_EMAIL: ${{ vars.EXPO_PUBLIC_COMPANY_EMAIL || 'support@worldsofttransfer.com' }}
      EXPO_PUBLIC_COMPANY_PHONE: ${{ vars.EXPO_PUBLIC_COMPANY_PHONE }}
      EXPO_PUBLIC_COMPANY_WHATSAPP: ${{ vars.EXPO_PUBLIC_COMPANY_WHATSAPP }}
      # Notifications push : identifiant du projet Expo (variable) et fichier Firebase (secret).
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - run: npm ci

      - name: Fichier Firebase (notifications Android)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json; fi

      - name: Projet natif Android
        run: npx expo prebuild --platform android --no-install

      - name: Compilation de l'APK
        working-directory: mobile/android
        # Mémoire Java relevée : l'assemblage final (dex) manquait parfois de place avec la valeur par défaut.
        run: |
          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          # Saut de ligne d'abord : le fichier généré ne se termine pas toujours par un retour à la ligne.
          printf '\norg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n' >> gradle.properties
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=${{ matrix.abi }}

      - name: Nom du fichier
        run: mv android/app/build/outputs/apk/release/app-release.apk "WorldSoft-Transfer-${{ matrix.label }}-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: WorldSoft-Transfer-APK-${{ matrix.label }}
          path: mobile/WorldSoft-Transfer-${{ matrix.label }}-*.apk
          retention-days: 30
