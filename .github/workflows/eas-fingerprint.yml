# Affiche l'empreinte SHA-256 du certificat qui signe le dernier AAB Android construit sur EAS.
# Cette empreinte est publique (elle sert à enregistrer l'appli auprès de Google Play), pas un secret.
# Prérequis : secret de dépôt EXPO_TOKEN. Lancement : onglet Actions → « Empreinte Android (EAS) ».
name: Empreinte Android (EAS)

on:
  # Lancé par une modification de ce fichier sur la branche de travail (le bouton « Run workflow »
  # n'apparaît que pour la branche par défaut).
  push:
    branches: [claude/loving-meitner-akjeks]
    paths: [".github/workflows/eas-fingerprint.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # eas-cli lit la configuration de l'appli : les dépendances doivent être installées.
      - run: npm ci

      - name: Télécharger le dernier AAB terminé et afficher l'empreinte
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -e
          npx --yes eas-cli@latest build:list --platform android --build-profile production --status finished --limit 1 --json --non-interactive > builds.json
          URL=$(node -e 'const b=JSON.parse(require("fs").readFileSync("builds.json","utf8"));console.log((b[0]&&b[0].artifacts&&b[0].artifacts.buildUrl)||"")')
          if [ -z "$URL" ]; then echo "::error::Aucun build Android terminé trouvé."; exit 1; fi
          echo "AAB_URL $URL"
          curl -sSL -o app.aab "$URL"
          keytool -printcert -jarfile app.aab | grep -E "Owner|SHA1|SHA256|Valid"

      - name: Lien de téléchargement du dernier APK (profil preview) terminé
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@latest build:list --platform android --build-profile preview --status finished --limit 1 --json --non-interactive > apk.json
          node -e 'const b=JSON.parse(require("fs").readFileSync("apk.json","utf8"))[0];console.log("APK_BUILD", b&&b.id, b&&b.createdAt);console.log("APK_URL", b&&b.artifacts&&b.artifacts.buildUrl)'

# Relancé pour lire le lien du dernier AAB de production.

      - name: État des derniers builds de production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@latest build:list --platform android --build-profile production --limit 3 --json --non-interactive > recent.json
          node -e 'for (const b of JSON.parse(require("fs").readFileSync("recent.json","utf8"))) console.log("BUILD", b.id, b.status, b.appBuildVersion, b.createdAt, (b.error&&b.error.message)||"")'
# Vérification 19:02
# Vérification 15:07:09
# Vérification 15:12:56
# Vérification 14:13:41
# Vérification 12:17:15

      - name: État des derniers builds de test (APK)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@latest build:list --platform android --build-profile preview --limit 3 --json --non-interactive > recent-preview.json
          node -e 'for (const b of JSON.parse(require("fs").readFileSync("recent-preview.json","utf8"))) console.log("PREVIEW", b.id, b.status, b.createdAt, (b.artifacts&&b.artifacts.buildUrl)||"", (b.error&&b.error.message)||"")'
